version: '3.8'

services:
  # 数据库服务（仅内网）
  db:
    image: postgres:15-alpine
    container_name: dify_agent_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password}
      POSTGRES_DB: ${POSTGRES_DB:-dify_agent}
    volumes:
      - ./data/db:/var/lib/postgresql/data

  # 后端服务（仅内网，由 Nginx 代理）
  backend:
    build: ./backend
    container_name: dify_agent_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-your_password}@db:5432/${POSTGRES_DB:-dify_agent}
      - SECRET_KEY=${SECRET_KEY:-your_secret_key_here}
      - DIFY_API_KEY=${DIFY_API_KEY}
      - DIFY_API_URL=${DIFY_API_URL}
    expose:
      - "8000"
    depends_on:
      - db
    volumes:
      - ./data/uploads:/app/uploads
    networks:
      - default
      - dify_network

  # 前端服务（仅内网，由 Nginx 代理）
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: dify_agent_frontend
    restart: always
    expose:
      - "3000"
    depends_on:
      - backend

  # Nginx 反向代理（唯一对外暴露的端口，cpolar 穿透此端口即可）
  nginx:
    image: nginx:alpine
    container_name: dify_agent_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

networks:
  dify_network:
    external: true
    name: docker_default

volumes:
  postgres_data:
